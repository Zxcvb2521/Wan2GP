[package]
name = "ai-creator-studio"
version = "0.1.0"
description = "AI Creator Studio"
authors = ["AI Creator Studio"]
edition = "2021"

[lib]
name = "ai_creator_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0" }

[dependencies]
tauri = { version = "2.8.0", features = [] }
tauri-plugin-opener = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
